name: 'Build and populate cache'
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  schedule:
    # rebuild everyday at 2:51
    # TIP: Choose a random time here so not all repositories are build at once:
    # https://www.random.org/clock-times/?num=1&earliest=01%3A00&latest=08%3A00&interval=5&format=html&rnd=new
    - cron: '50 7 * * *'

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        build_target:
          - google-coral
    runs-on: ubuntu-latest
    env:
      GIT_SSL_NO_VERIFY: 'true'
    steps:
      - name: Maximize github runner space
        uses: justinthelaw/maximize-github-runner-space@v0.12.3
        with:
          cleanup-profile: custom
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          swapfile-size: 32GiB

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify disk and swap after cleanup
        run: |
          df -h / /mnt
          free -h
          swapon --show

      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:latest
          platforms: all

      - name: Install nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            extra-platforms = i686-linux aarch64-linux arm-linux
            substituters = https://nix-community.cachix.org https://cache.nixos.org/
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
            trusted-substituters = https://nix-community.cachix.org https://cache.nixos.org/

      - name: Setup GitHub Actions cache for Nix
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 1073741824
          purge: false

      - name: Set nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

          cat > override.conf <<EOF
          [Service]
          Environment="TMPDIR=/nix/tmpdir"
          EOF
          sudo mkdir /etc/systemd/system/nix-daemon.service.d/
          sudo mv override.conf /etc/systemd/system/nix-daemon.service.d/override.conf
          sudo systemctl daemon-reload
          sudo systemctl restart nix-daemon

      - name: Build nix packages
        run: |
          # Workaround GitHub Actions timeout
          (while true; do date; sleep 60; done) &

          env TMPDIR=/nix/tmpdir nix build -L .#${{ matrix.build_target }}
          mkdir ${{ matrix.build_target }}
          cp -r result/* ${{ matrix.build_target }}/

      - name: Upload files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build_target }}
          path: ${{ matrix.build_target }}/
